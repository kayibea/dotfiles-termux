set-option -g mouse on
set -g history-limit 10000

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

unbind r
bind r source-file ~/.config/tmux/tmux.conf

unbind-key &
bind-key & kill-window
unbind-key x
bind-key x kill-pane

# Set base colors
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 100
set -g status-right-length 100

# Left side: session name
set -g status-left "#[fg=#89b4fa,bold] #S #[default]"

# Right side: time, date, host
set -g status-right "#[fg=#94e2d5]#H #[fg=#f38ba8]| %m-%d #[fg=#fab387]%H:%M #[default]"

# Window status colors
set-window-option -g window-status-style "fg=#a6adc8,bg=#1e1e2e"
set-window-option -g window-status-current-style "fg=#1e1e2e,bg=#89b4fa,bold"

# Window status format
set -g window-status-format " #[fg=#a6adc8]#I:#W#F "
set -g window-status-current-format " #[bg=#89b4fa,fg=#1e1e2e]#I:#W#F "

# Pane border styling
set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#89b4fa"

# Message styling
set -g message-style "bg=#1e1e2e,fg=#f9e2af"

# Command prompt styling
set -g message-command-style "bg=#1e1e2e,fg=#f9e2af"
